<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トビラ せかい版 — 世界の遺児と、おかねと選択肢の人生すごろく</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 見た目はオンライン版（door-world-online/public/index.html）にそろえてある。
   オンライン専用のもの（ルーム・あいことば・観戦・進行役メニュー）は持ってきていない */
:root{
  --page:#F2F9FD; --card:#FFFFFF; --ink:#3F5266; --sub:#8A97A5; --line:#E3EDF4;
  --pink:#F4879F; --gold:#FBD96B; --btn:#5B7FA8; --btn-d:#43617F;
  --money:#D9A32B; --learn:#4E8FC0; --happy:#E4708F;
  --ok:#86D9A5; --lock:#FFC98C; --unseen:#B7A6EA;
  --wrap:1180px;
  --sh:0 4px 16px rgba(63,82,102,.10);
  --sh-s:0 2px 8px rgba(63,82,102,.10);
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;
  background:var(--page); color:var(--ink); line-height:1.8;
  font-variant-numeric:tabular-nums;
}
button{font-family:inherit; cursor:pointer; border:none;}
.screen{display:none; min-height:100vh;}
.screen.active{display:block;}
.ic{width:1.05em; height:1.05em; vertical-align:-.16em; flex:none;}
.ic.s{width:.92em; height:.92em;}

/* ---------- はじめの画面 ---------- */
#setup{display:none; place-items:center; padding:26px 18px;}
#setup.active{display:grid;}
.setup-card{width:min(520px,100%); margin:0 auto; text-align:center;}
.title-door{width:104px; height:128px; margin:0 auto 14px; position:relative;
  background:var(--pink); border-radius:52px 52px 10px 10px; display:grid; place-items:center;
  box-shadow:0 6px 0 rgba(214,104,130,.4);}
.title-door .leaf{width:82px; height:106px; border-radius:41px 41px 7px 7px; background:#FBD96B;
  position:relative; transition:transform .6s cubic-bezier(.2,.8,.3,1.2); transform-origin:left center;}
.title-door:hover .leaf{transform:perspective(400px) rotateY(-36deg);}
.title-door .knob{position:absolute; right:12px; top:56px; width:11px; height:11px;
  border-radius:50%; background:var(--btn);}
h1.game-title{font-size:clamp(32px,8vw,48px); font-weight:900; letter-spacing:.1em;}
.game-sub{font-size:14px; font-weight:700; color:var(--sub); margin:6px 0 24px;}
.player-inputs{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
.p-row{display:flex; align-items:center; gap:10px; background:var(--card); border-radius:16px;
  padding:9px 14px; box-shadow:var(--sh-s);}
.p-dot{width:20px; height:20px; border-radius:50%; flex:none;}
.p-row input{flex:1; border:none; outline:none; font-family:inherit; font-size:16px;
  font-weight:700; color:var(--ink); background:transparent; min-width:0;}
.p-row .rm{background:transparent; font-size:17px; color:var(--happy); font-weight:900; padding:2px 6px;}
.row-btns{display:flex; gap:10px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;}
.chip-btn{background:var(--card); border-radius:999px; padding:8px 18px; font-weight:700;
  font-size:13.5px; color:var(--ink); box-shadow:var(--sh-s);}
.chip-btn.on{background:var(--gold); color:#7A6320;}
.fac-toggle{display:flex; align-items:flex-start; gap:9px; text-align:left; background:var(--card);
  border-radius:16px; padding:12px 15px; font-size:12.5px; font-weight:700; line-height:1.7;
  margin:0 auto 20px; width:min(440px,100%); cursor:pointer; box-shadow:var(--sh-s);}
.fac-toggle input{width:18px; height:18px; margin-top:3px; accent-color:var(--pink); flex:none;}
.fac-toggle small{color:var(--sub);}
.big-btn{display:inline-block; background:var(--pink); color:#fff; font-size:18px; font-weight:900;
  padding:15px 42px; border-radius:999px; letter-spacing:.08em; box-shadow:0 5px 0 #D66882;
  transition:transform .08s;}
.big-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #D66882;}
.setup-note{margin-top:16px; font-size:12.5px; line-height:1.85; color:var(--sub); font-weight:700;}

/* ---------- ゲーム画面 ---------- */
#game{padding:0 0 96px;}
/* PCは1画面におさめる。盤面の縦横比から、残りの高さで横幅を決める。
   ヘッダー・サイコロ・余白でおよそ 244px ぶんを引いている */
@media (min-width:701px){
  /* --board-aspect は盤面の縦横比。描くたびに入れかえる（36マス=1.386） */
  :root{--wrap:min(1700px, calc((100vh - 244px) * var(--board-aspect, 1.386) + 24px));}
}
.sticky-head{position:sticky; top:0; z-index:40; background:var(--page);
  padding:10px 12px 8px; box-shadow:0 8px 12px -10px rgba(63,82,102,.3);}
.topbar{display:flex; align-items:center; gap:9px; max-width:var(--wrap); margin:0 auto 9px;}
.topbar .logo{font-weight:900; font-size:17px; letter-spacing:.08em; color:var(--pink); flex:none;}
.turn-pill{flex:1; min-width:0; display:flex; align-items:center; gap:9px;
  background:color-mix(in srgb, var(--ring, var(--pink)) 17%, #fff);
  box-shadow:inset 0 0 0 2px color-mix(in srgb, var(--ring, var(--pink)) 45%, #fff);
  border-radius:999px; padding:6px 14px; font-weight:900; font-size:clamp(13px,2.4vw,15px);
  overflow:hidden;}
.turn-pill .av{width:28px; height:28px; border-radius:50%; flex:none;
  border:2px solid var(--ring, var(--pink));
  background-color:#fff; background-size:cover; background-position:center 16%;}
.turn-pill .tp-txt{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.help-btn{height:40px; border-radius:999px; background:var(--card); display:inline-flex;
  align-items:center; justify-content:center; gap:6px; padding:0 15px; color:var(--btn);
  box-shadow:var(--sh-s); flex:none;}
.help-btn .ic{width:21px; height:21px;}
.help-btn .lbl{font-size:12.5px; font-weight:900; color:var(--ink); white-space:nowrap;}
.help-btn:active{transform:translateY(1px);}
.players-strip{display:flex; gap:8px; overflow-x:auto; max-width:var(--wrap); margin:0 auto;
  padding:2px 2px 6px;}
.pcard{flex:1 0 156px; background:var(--card); border-radius:15px; padding:8px 11px;
  box-shadow:var(--sh-s); display:flex; gap:9px; align-items:center; opacity:.72; transition:opacity .2s;}
.pcard.now{opacity:1; box-shadow:0 0 0 2.5px var(--ring, var(--pink)), var(--sh-s);}
.pcard.done{opacity:.45;}
/* 押すとその人の家庭カードが開く */
.pcard.tap{cursor:pointer; transition:opacity .2s, transform .08s;}
.pcard.tap:hover{opacity:1;}
.pcard.tap:active{transform:translateY(1px);}
/* 「とくい」に付ける、本人だけの印 */
.only-you{display:inline-flex; align-items:center; gap:3px; margin-left:6px; font-size:10px; font-weight:900;
  color:#fff; background:var(--btn); border-radius:999px; padding:0 8px; vertical-align:1px;}
.pcard .av{width:38px; height:38px; border-radius:50%; flex:none; border:2.5px solid var(--line);
  background-color:#F7FBFD; background-size:cover; background-position:center 16%;}
.pcard .nm{font-size:12.5px; font-weight:900; line-height:1.35; display:flex; align-items:center; gap:5px;}
.pcard .age{font-size:10.5px; font-weight:700; color:var(--sub);}
.pcard .row{display:flex; gap:8px; font-size:11px; font-weight:900; margin-top:1px;}
.pcard .row span{display:inline-flex; align-items:center; gap:2px;}
.m1{color:var(--money);} .m2{color:var(--learn);} .m3{color:var(--happy);}
.board-wrap{max-width:var(--wrap); margin:10px auto 0; padding:0 12px;}
#board{display:block; width:100%; height:auto; border-radius:18px;}
.controls{position:fixed; left:0; right:0; bottom:0; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex; justify-content:center; z-index:50; pointer-events:none;
  background:linear-gradient(transparent,rgba(242,249,253,.9) 40%);}
.dice-btn{pointer-events:auto; background:var(--btn); color:#fff; font-size:17px; font-weight:900;
  letter-spacing:.06em; padding:14px 40px; border-radius:999px; box-shadow:0 5px 0 var(--btn-d);
  display:flex; align-items:center; gap:11px; transition:transform .08s;}
.dice-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--btn-d);}
.dice-btn:disabled{opacity:.5; cursor:default;}
.dice-face{background:#fff; border-radius:11px; width:38px; height:38px; display:grid;
  grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:6px; gap:1px;}
.dice-face span{display:grid; place-items:center;}
.dice-face i{width:6px; height:6px; border-radius:50%; background:var(--pink);}

/* ---------- サイコロの演出 ---------- */
.dice-stage{position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:18px; background:rgba(242,249,253,.72);
  backdrop-filter:blur(2px); pointer-events:none;}
.dice-stage.on{display:flex;}
/* 立体のサイコロ。6面ぶんの面を組んで、本体ごと転がす。
   出目は「その面が正面を向く向き」に本体を回して見せる（JS の FACE_ROT） */
.die-scene{--die:min(160px,38vw); width:var(--die); aspect-ratio:1; perspective:760px;}
.die-scene.land{animation:bigLand .5s cubic-bezier(.2,1.4,.4,1);}
.big-die{width:100%; height:100%; position:relative; transform-style:preserve-3d;}
.big-die .face{position:absolute; inset:0; background:#fff; border-radius:24px;
  border:2px solid #E8F0F6; box-shadow:inset 0 -6px 0 rgba(63,82,102,.07);
  display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
  padding:15px; gap:4px; backface-visibility:hidden;}
.big-die .f1{transform:                translateZ(calc(var(--die) / 2));}
.big-die .f2{transform:rotateY(90deg)  translateZ(calc(var(--die) / 2));}
.big-die .f3{transform:rotateX(90deg)  translateZ(calc(var(--die) / 2));}
.big-die .f4{transform:rotateX(-90deg) translateZ(calc(var(--die) / 2));}
.big-die .f5{transform:rotateY(-90deg) translateZ(calc(var(--die) / 2));}
.big-die .f6{transform:rotateY(180deg) translateZ(calc(var(--die) / 2));}
.big-die span{display:grid; place-items:center;}
.big-die i{width:22%; aspect-ratio:1; min-width:12px; border-radius:50%; background:var(--pink);}
.big-die.roll{animation:bigTumble 1.5s linear infinite;}
.big-die.land{transition:transform .6s cubic-bezier(.2,.85,.3,1.15);}
@keyframes bigTumble{from{transform:rotateX(0deg) rotateY(0deg) rotateZ(0deg)}
  to{transform:rotateX(720deg) rotateY(1080deg) rotateZ(360deg)}}
@keyframes bigLand{0%{transform:scale(1.22)}60%{transform:scale(.95)}100%{transform:scale(1)}}
.die-msg{font-size:clamp(19px,4.6vw,26px); font-weight:900; color:var(--ink); letter-spacing:.06em;
  min-height:1.6em;}

/* ---------- モーダル ---------- */
.overlay{position:fixed; inset:0; background:rgba(63,82,102,.42); z-index:100;
  display:none; place-items:center; padding:16px;}
.overlay.open{display:grid;}
.modal{width:min(420px,100%); max-height:88vh; overflow-y:auto; background:var(--card);
  border-radius:24px; box-shadow:0 12px 36px rgba(63,82,102,.28);
  animation:pop .26s cubic-bezier(.2,.8,.3,1.2);}
@keyframes pop{from{transform:scale(.88); opacity:0} to{transform:scale(1); opacity:1}}
.m-head{padding:18px 20px 15px; text-align:center;}
.m-tag{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:900;
  letter-spacing:.1em; padding:4px 13px; border-radius:999px; color:#fff;}
.modal h2{font-size:clamp(19px,4.4vw,23px); font-weight:900; margin-top:9px; line-height:1.45;}
.m-sub{font-size:12px; font-weight:700; color:var(--sub);}
.m-body{padding:4px 20px 20px;}
.m-lead{font-size:13px; font-weight:700; color:#54677A; text-align:center; line-height:1.85;
  margin-bottom:14px;}
.m-note{background:#F7FBFD; border-radius:14px; padding:11px 14px; font-size:12.5px;
  font-weight:700; line-height:1.8; margin-bottom:13px;}
.m-note.priv{background:#FBF4FB;}
.m-btn{display:block; width:100%; background:var(--btn); color:#fff; font-size:15px; font-weight:900;
  padding:13px; border-radius:999px; margin-top:6px; box-shadow:0 4px 0 var(--btn-d); transition:transform .08s;}
.m-btn:active{transform:translateY(2px); box-shadow:0 2px 0 var(--btn-d);}
.m-btn.ghost{background:var(--card); color:var(--ink); box-shadow:var(--sh-s);}
.fx-line{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:12px 0 14px;}
.fx{background:#F7FBFD; border-radius:999px; padding:4px 14px; font-weight:900; font-size:14px;
  display:inline-flex; align-items:center; gap:4px;}

/* 選択肢（トビラ）。どれも同じ青のボタン。開くかどうかは押すまで分からない */
.door-list{display:flex; flex-direction:column; gap:9px;}
.door{display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  border-radius:16px; padding:13px 16px;
  transition:background .14s, transform .08s; background:#E8F0F8; color:var(--ink);
  box-shadow:inset 0 0 0 2px #DAE7F3; --leaf-fill:#E8F0F8;}
/* トビラの目じるし。わく（奥）と扉（手前）を重ねて置き、ホバーすると扉だけが手前にひらく */
.d-mark{flex:none; display:grid; place-items:center; width:30px; height:30px; color:#4B6E93;}
.d-mark .ic{grid-area:1 / 1; width:30px; height:30px;}
.d-mark .leaf{transform-origin:25% 50%; transition:transform .42s cubic-bezier(.2,.8,.3,1.2);}
.door.pick:hover .d-mark .leaf,
.door.pick:focus-visible .d-mark .leaf{transform:perspective(140px) rotateY(-58deg);}
.d-mark.unseen{color:#6E5BA8;}
.d-main{flex:1; min-width:0;}
.door.pick{cursor:pointer;}
.door.pick:hover{background:#DBE9F7; box-shadow:inset 0 0 0 2px #BED4EA; --leaf-fill:#DBE9F7;}
.door:not(:disabled):active{transform:translateY(2px);}
@media (prefers-reduced-motion:reduce){ .d-mark .leaf{transition:none;} }
/* 押したあとの確認 */
.c-card{border-radius:18px; padding:14px 16px; margin-bottom:15px;}
.c-card.ok{background:#EAF6EF; box-shadow:inset 0 0 0 2px #C9E7D6;}
.c-card.ng{background:#FAEEE9; box-shadow:inset 0 0 0 2px #EFD7CB;}
.c-title{font-size:17px; font-weight:900; line-height:1.5; margin-bottom:3px;}
.c-key{margin-top:9px; font-size:12.5px; font-weight:900; color:#7A5E2E; line-height:1.7;}
.c-key .c-now{display:block; font-size:11.5px; font-weight:700; color:var(--sub);}
.c-key .m1, .c-key .m2{display:inline-flex; align-items:center; gap:2px; font-weight:900;}
.c-ask{text-align:center; font-size:14.5px; font-weight:900; margin:4px 0 12px; line-height:1.7;}
.c-ask.ng{color:#B4643C; font-size:13.5px; display:flex; align-items:center;
  justify-content:center; gap:6px; flex-wrap:wrap;}
.d-badge{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:900;
  letter-spacing:.04em; border-radius:999px; padding:2px 10px; margin-bottom:6px;}
.d-badge.open{background:#CFEBDC; color:#3B7E58;}
.d-badge.lock{background:#F6DFD2; color:#B4682F;}
/* トビラの画面に置く、画面上部とおなじプレイヤーカード */
.pcard.m-pcard{opacity:1; margin-bottom:13px; padding:12px 16px; border-radius:16px; gap:11px;
  box-shadow:inset 0 0 0 2.5px var(--ring, var(--pink)), var(--sh-s);}
.pcard.m-pcard .av{width:46px; height:46px;}
.pcard.m-pcard .nm{font-size:15px; gap:6px;}
.pcard.m-pcard .age{font-size:12.5px;}
.pcard.m-pcard .row{font-size:15px; gap:13px; margin-top:3px;}
.door .d-title{display:block; font-size:15px; font-weight:900; line-height:1.45;}
.door .d-desc, .c-card .d-desc{display:block; font-size:11.5px; font-weight:700; color:#6E7E8C; margin-top:3px; line-height:1.65;}
/* 「でも、〜」。選ぶと失うもの */
.d-cons{display:block; font-size:11.5px; font-weight:700; color:#B4707A; margin-top:4px; line-height:1.65;}
.c-card.ng .d-cons{color:#BC8A8A;}
.door.unseen{background:repeating-linear-gradient(45deg,#F1F3F5,#F1F3F5 9px,#EAEEF1 9px,#EAEEF1 18px);
  cursor:not-allowed; box-shadow:none;}
.door.unseen .d-title{color:#9AA7B2; letter-spacing:.16em;}
.door.unseen .d-desc{color:#AEB9C2;}
.d-cost{font-size:13px; font-weight:900; margin-top:8px; display:flex; align-items:center; gap:5px;}
.d-cost.minus{color:#C25B5B;} .d-cost.plus{color:#4FA85E;}
.d-cost s{opacity:.55; margin-right:3px; font-weight:700;}
@media (max-width:560px){ .logo{display:none;} }

/* ステータス変化 */
.chg-body{display:flex; gap:13px; align-items:center; padding:16px 18px 6px;}
.chg-char{width:74px; height:98px; flex:none; background-size:contain;
  background-repeat:no-repeat; background-position:center bottom;}
.chg-rows{flex:1; min-width:0; display:flex; flex-direction:column; gap:7px;}
.chg-r{display:grid; grid-template-columns:58px 1fr auto; align-items:center; gap:8px;
  border-radius:12px; padding:8px 12px;}
.chg-r.money{background:#FFF4DC;} .chg-r.money .k{color:#B98A2A;}
.chg-r.learn{background:#E7F2FC;} .chg-r.learn .k{color:#3F7EAC;}
.chg-r.happy{background:#FDECF2;} .chg-r.happy .k{color:#CE6288;}
.chg-r .k{font-size:11px; font-weight:900;}
.chg-r .v{font-size:14.5px; font-weight:900; display:flex; align-items:center; gap:3px;}
.chg-r .v s{color:#B4C1CB; font-weight:700; margin-right:3px; display:inline-flex; align-items:center; gap:2px;}
.chg-r .d{font-size:13.5px; font-weight:900;}
.up{color:#4FA85E;} .dn{color:#D9737B;}

/* 家庭カード */
/* 上の帯は、そのカードの持ち主の色。盤面のコマ・上部の手番表示とそろえる */
.fam-top{padding:16px 18px 14px; display:flex; gap:13px; align-items:center;
  background:linear-gradient(120deg,
    color-mix(in srgb, var(--fam, var(--pink)) 92%, var(--ink)),
    color-mix(in srgb, var(--fam, var(--pink)) 74%, var(--ink)));}
.fam-top .av{width:60px; height:60px; border-radius:50%; flex:none; border:3px solid #fff;
  background-color:#fff; background-size:cover; background-position:center 16%;
  box-shadow:0 2px 8px rgba(63,82,102,.22);}
.fam-top .pill{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:900;
  letter-spacing:.08em; background:rgba(255,255,255,.92); border-radius:999px; padding:2px 10px; margin-bottom:5px;}
.fam-top .nm{font-size:16.5px; font-weight:900; line-height:1.45; color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.15);}
.fam-story{font-size:12.5px; font-weight:700; line-height:1.9; color:#54677A;
  background:#F7FBFD; border-radius:14px; padding:12px 14px;}
.fam-asa{font-size:11.5px; font-weight:700; color:#7C8B99; margin-top:9px; line-height:1.75;}
.fam-asa b{color:#C98A3C;}
/* 1日の暮らしにつかえるお金。生まれた場所の差が、いちばん短く出る一行 */
.fam-daily{font-size:11.5px; font-weight:700; color:#7C8B99; margin-top:6px; line-height:1.75;}
.fam-daily b{color:#4A3A30; font-size:12.5px;}
.fam-daily .note{color:#C4788A;}
/* カードの中の「いまのステータス」と「トビラの記録」 */
.now-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:11px;}
.ns{border-radius:13px; padding:8px 10px 9px;}
.ns.money{background:#FFF4DC;} .ns.learn{background:#E7F2FC;} .ns.happy{background:#FDECF2;}
.ns .k{display:flex; align-items:center; gap:4px; font-size:10.5px; font-weight:900;}
.ns.money .k{color:#B98A2A;} .ns.learn .k{color:#3F7EAC;} .ns.happy .k{color:#CE6288;}
.ns .v{font-size:17px; font-weight:900; line-height:1.4;}
.now-doors{margin-top:9px; background:#F7FBFD; border-radius:13px; padding:9px 12px;}
.now-doors .k{display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:900; color:var(--sub);}
.now-doors .dl{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11.5px; font-weight:700; margin-top:4px;}
.now-doors .lo{color:#4CA872;} .now-doors .ll{color:#C98A3C;} .now-doors .lu{color:#7E6BC4;}
.fam-perk{margin-top:11px; background:linear-gradient(100deg,#FFF0F6,#F3F0FF); border-radius:14px;
  padding:11px 14px;}
.fam-perk .k{font-size:10.5px; font-weight:900; color:#A9629B; letter-spacing:.08em;
  display:flex; align-items:center; gap:5px;}
.fam-perk .v{font-size:13px; font-weight:900; line-height:1.6; color:#5B4A6B;}
/* その人がえらんできたこと */
.fam-mine{margin-top:11px; background:#F1F8F4; border-radius:14px; padding:11px 13px;}
.fam-mine .k{font-size:10.5px; font-weight:900; color:#3E7D5F; letter-spacing:.06em;
  display:flex; align-items:center; gap:5px; margin-bottom:8px;}
.mc-list{display:flex; flex-direction:column; gap:6px;}
.mc-row{display:flex; gap:9px; align-items:flex-start; background:#fff; border-radius:11px; padding:7px 10px;}
.mc-age{flex:none; width:40px; font-size:10.5px; font-weight:900; color:var(--sub); padding-top:2px;}
.mc-main{min-width:0; display:flex; flex-direction:column;}
.mc-door{font-size:10.5px; font-weight:900; color:var(--sub);}
.mc-t{font-size:12.5px; font-weight:900; line-height:1.55;}
.mc-fx{display:flex; gap:9px; font-size:11px; font-weight:900; margin-top:3px;}
.mc-note{font-size:10.5px; font-weight:700; color:#7D9A8A; line-height:1.7; margin-top:9px;}
.fam-secret{margin-top:11px; font-size:11px; font-weight:700; color:var(--sub); text-align:center;
  display:flex; align-items:center; justify-content:center; gap:5px;}
/* 「とくい」をこっそり見る前の、目かくしの画面 */
.peek{display:grid; place-items:center; width:92px; height:92px; margin:4px auto 14px; border-radius:50%;
  background:linear-gradient(135deg,#FFF0F6,#F3F0FF); color:#A9629B;}
.peek .ic{width:44px; height:44px;}

#result{padding:30px 16px 60px;}
.res-inner{max-width:760px; margin:0 auto;}
#result h1{font-size:clamp(25px,6vw,36px); font-weight:900; text-align:center; margin-bottom:6px;

.res-sub{text-align:center; font-weight:700; color:var(--sub); margin-bottom:24px; font-size:13.5px;}
.res-card{background:var(--card); border-radius:20px; padding:16px 18px 18px; margin-bottom:14px;
  box-shadow:var(--sh);}
.res-head{display:flex; gap:12px; align-items:center;}
.res-head .av{width:50px; height:50px; border-radius:50%; flex:none; border:3px solid var(--pink);
  background-color:#F7FBFD; background-size:cover; background-position:center 16%;}
.rank{display:inline-block; font-size:12px; font-weight:900; background:var(--gold); color:#7A6320;
  border-radius:999px; padding:2px 12px;}
.r-name{font-size:17px; font-weight:900; margin-top:2px;}
.r-fam{font-size:12px; font-weight:900; display:flex; align-items:center; gap:5px; margin-top:1px;}
.r-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-top:12px;}
.rs{border-radius:15px; padding:10px 12px 11px;}
.rs.money{background:#FFF4DC;} .rs.learn{background:#E7F2FC;} .rs.happy{background:#FDECF2;}
.rs .k{display:flex; align-items:center; gap:5px; font-size:11.5px; font-weight:900; line-height:1.4;}
.rs .k .ic{width:18px; height:18px;}
.rs.money .k{color:#B98A2A;} .rs.learn .k{color:#3F7EAC;} .rs.happy .k{color:#CE6288;}

.rs .v s{font-size:12.5px; font-weight:700; color:#AEBBC5;}
.rs .d{font-size:12.5px; font-weight:900; color:var(--sub); margin-top:1px;}

.r-loan{margin-top:10px; background:#FFF6E2; border-radius:13px; padding:8px 13px;

/* プレイヤーに割りあてるキャラ（家庭カードとは無関係。ランダムに配る） */
/* ロビー（家庭カードを配る前）でだけ使う、席ごとの仮のキャラ。
   p5・p6 はコードで描いた仮の絵だが、配ったあとは下の CHAR_POOL から選びなおすので、
   ゲーム中に出ることはない */
const CHARS = ["p1","p2","p3","p4","p5","p6"];

/* ── キャラは家庭カードで決まる（2026-10-06〜） ──
   家庭カードを全員に見せるようにしたので、見た目も生まれた場所にそろえる。
   FAM_LOOK で家庭→見た目の系統、CHAR_POOL でその系統のキャラを選ぶ。
   1ゲームに同じキャラは出さない。ウガンダの家庭(w3/w5/w6)は最大3人同時に出るので、
   黒人の子は服の色ちがい(bb2/bg2)まで用意してあり、足りないときだけ使う。
   プレイヤーの色(リングや名札の色)は、キャラの服の色にそろえる。 */
const FAM_LOOK = {
  w1: "white",   /* 欧米 */
  w2: "jp",      /* 日本 */
  w3: "black",   /* ウガンダ・両親あり */
  w4: "jp",      /* 外交官としてウガンダに駐在（「長期休みには帰国する」ので日本から来た家庭として描く） */
  w5: "black",   /* ウガンダの遺児・支援あり */
  w6: "black",   /* ウガンダの遺児・支援なし */
};
/* 系統ごとのキャラ。内側の配列が優先順で、前の段が埋まったときだけ次の段を使う */
const CHAR_POOL = {
  jp:    [["p1","p2","p3","p4"]],
  white: [["wb","wg"]],
  black: [["bb","bg"], ["bb2","bg2"]],   /* bb2/bg2 は bb/bg の服の色ちがい */
};
const CHAR_COLOR = {
  p1:"#F4879F", p2:"#6FA9DD", p3:"#A98BD9", p4:"#6FC49B", p5:"#E89A5C", p6:"#57BCC9",
  wb:"#86B8F2", wg:"#F5A3B3", bb:"#3FB6BF", bg:"#F47A70", bb2:"#E5B23C", bg2:"#93C84A",
};
/* 家庭が配られたプレイヤーに、キャラと色を割りあてる（サーバーで1回だけ呼ぶ） */
function assignChars(players){
  const used = new Set();
  for(const p of players){
    const tiers = CHAR_POOL[FAM_LOOK[p.fam && p.fam.id]] || CHAR_POOL.jp;
    let pick = null;
    for(const tier of tiers){
      const free = tier.filter(c => !used.has(c));
      if(free.length){ pick = free[Math.floor(Math.random()*free.length)]; break; }
    }
    if(!pick){ const all = tiers.flat(); pick = all[Math.floor(Math.random()*all.length)]; }  /* 理論上こない */
    used.add(pick);
    p.char = pick; p.color = CHAR_COLOR[pick];
  }
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}


function jobTitle(p){
  const n = p.learn;
  if(n <= 1) return {ic:"🌾", t:{ja:"畑・市場の手伝い",en:"Field & market helper"}};
  if(n <= 2) return {ic:"🔧", t:{ja:"見習い・日雇いのしごと",en:"Apprentice & day labor"}};
  if(n <= 3) return {ic:"🧵", t:{ja:"縫製・工房のスタッフ",en:"Sewing & workshop staff"}};
  if(n <= 4) return {ic:"🏪", t:{ja:"お店のリーダー",en:"Shop team leader"}};
  if(n <= 5) return {ic:"💻", t:{ja:"専門職・エンジニア",en:"Specialist & engineer"}};
  if(n <= 6) return {ic:"🏢", t:{ja:"国際企業のスタッフ",en:"Global company staff"}};
  return {ic:"👑", t:{ja:"マネージャー・専門家",en:"Manager & expert"}};
}

/* 「まだ見えていない選択肢」の数。p.hidden はタグの配列なので、その長さを数えると
   実際に？？？になる選択肢の数とズレる（例：遺児・支援なしはタグ3個だが選択肢は5個）。
   盤面に残っているトビラを実際に開いて、これから出会う？？？を数える。
   fromPos を渡すと、そのマスより先のトビラだけを数える（もう通りすぎた扉は数えない）。 */
function hiddenOptionCount(p, fromPos, m = MODES.full){
  let n = 0;
  m.SQUARES.forEach((sq, i) => {
    if(sq.t !== "choice" || i <= (fromPos || 0)) return;
    const def = choiceDef(sq.key, p, m);
    n += def.opts.filter(o => o.tag && p.hidden.includes(o.tag)).length;
  });
  return n;
}

function revealTags(p, target, n){
  const order = ["shien","chiiki","career","global"];
  let count = 0;
  if(target !== "any" && p.hidden.includes(target)){ unhideTag(p, target); count++; n--; }
  for(const t of order){
    if(n <= 0) break;
    if(p.hidden.includes(t)){ unhideTag(p, t); count++; n--; }
  }
  return count;
}
/* 「まだ支援と出会えていない遺児」：支援がはじめて見えた瞬間に発動 */
function checkDeai(p){
  if(p.perk === "deai" && !p.deaiUsed && !p.hidden.includes("shien")){
    p.deaiUsed = true;
    p.shienDiscount = true;
    p.learn += 1;
    return {ja:"🎗 はじめて「支援」の存在を知った——出会いがチカラになる！ まなび+1、これから支援・まなび系のトビラのカギが <b>−50万</b> になる。",
            en:"🎗 You just learned that support exists — the meeting becomes power! Learn +1, and aid/learning door keys now cost <b>−¥500k</b>."};
  }
  return null;
}

function applyFx(p, fx){
  p.money += fx.money||0;
  p.learn += fx.learn||0;
  p.happy += fx.happy||0;
}
function effectiveMoneyReq(p, o){
  let m = o.req.money || 0;
  if(p.shienDiscount && (o.tag === "shien" || o.tag === "manabi")) m = Math.max(0, m - 50);
  if(p.perk === "kokusai" && o.tag === "global") m = Math.max(0, m - 50);
  return m;
}
/* 🎗支援サポート・🌏国際感覚は、カギ（必要額）だけでなく、はらうお金も軽くする */
function effectiveMoneyFx(p, o){
  const m = o.fx.money || 0;
  if(m >= 0) return m;
  let cut = 0;
  if(p.shienDiscount && (o.tag === "shien" || o.tag === "manabi")) cut += 50;
  if(p.perk === "kokusai" && o.tag === "global") cut += 50;
  return cut ? Math.min(0, m + cut) : m;
}
function effectiveLearnReq(p, o){
  let l = o.req.learn || 0;
  if(p.perk === "eigo" && o.tag === "global") l = Math.max(0, l - 2);
  return l;
}
function meetsReq(p, o){
  if(o.req.univ && !p.univ) return false;   /* 大学を出ていること。24歳ではもう取り返せないカギ */
  const em = effectiveMoneyReq(p, o);
  if(em > 0 && em > p.money) return false;  /* カギなし(0円)の選択肢は借金中でも選べる */
  if(effectiveLearnReq(p, o) > p.learn) return false;
  if(o.req.maxMoney != null && p.money >= o.req.maxMoney) return false;  /* 所得制限 */
  return true;
}

<script>

   音のファイルは持たない。鳴らすたびに WebAudio で組み立てる。
   （読みこみを増やさない・回線が細い会場でも鳴る・著作権の管理もいらない）

   最初のタップで AudioContext をつなぐ（app.js の pointerdown から resume() を呼ぶ）。 */

const KEY = "tobira-se";
let on = localStorage.getItem(KEY) !== "off";
let ctx = null;

const isOn = () => on;
function setOn(v) {
  on = !!v;
  try { localStorage.setItem(KEY, on ? "on" : "off"); } catch {}
  if (on) resume();
}
function toggle() { setOn(!on); return on; }

/* 音が出せる状態の AudioContext を返す。出せないときは null（無音のまま進む） */
function ac() {
  if (!on) return null;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  } catch { return null; }
}
function resume() { ac(); }

/* ---- 音のもと ---- */
/* ひとつの音。山なりの音量にして、ブツッと切れないようにする */
function tone(c, { f, to, at = 0, dur = .12, type = "sine", vol = .16 }) {
  const t0 = c.currentTime + at;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(.02, dur / 3));
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(c.destination);
  o.start(t0);
  o.stop(t0 + dur + .03);
}
/* ざらっとした音（サイコロのころがり、紙をめくる感じ） */
function noise(c, { at = 0, dur = .12, vol = .1, f = 1400, q = .7 }) {
  const t0 = c.currentTime + at;
  const n = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = c.createBufferSource(); src.buffer = buf;
  const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
  const g = c.createGain(); g.gain.value = vol;

  src.stop(t0 + dur + .02);
}

function seq(c, notes, { dur = .13, type = "triangle", vol = .16, gap = .09 } = {}) {

  pop:   c => { tone(c, { f: N.D5, dur: .1, type: "triangle", vol: .13 });

  /* サイコロ：ころがる → 止まる */
  roll:  c => [0, .12, .24, .36].forEach(at => noise(c, { at, dur: .1, vol: .09, f: 1800 })),
  land:  c => { tone(c, { f: 180, to: 90, dur: .16, type: "square", vol: .12 });

  /* コマが1マスすすむ */
  step:  c => tone(c, { f: N.E5, dur: .05, type: "sine", vol: .07 }),
  /* トビラの一覧が出る（ノックのような低い2つ） */
  door:  c => { tone(c, { f: 320, dur: .08, type: "sine", vol: .13 });

  /* 開けられると分かった瞬間 */
  unlock:c => { noise(c, { dur: .07, vol: .07, f: 2600 });

  /* カギが足りなかった */
  locked:c => { tone(c, { f: 210, to: 130, dur: .22, type: "sawtooth", vol: .1 });
                tone(c, { f: 150, at: .05, dur: .16, type: "square", vol: .07 }); },
  /* トビラを開けた */
  open:  c => seq(c, [N.C5, N.E5, N.G5, N.C6], { dur: .14, gap: .07, vol: .15 }),
  /* できごと：うれしい／つらい */
  good:  c => seq(c, [N.E5, N.G5, N.C6], { dur: .14, gap: .08, vol: .15 }),
  bad:   c => { tone(c, { f: N.A4, to: N.E4, dur: .26, type: "triangle", vol: .13 });

  card:  c => { noise(c, { dur: .16, vol: .08, f: 900, q: .5 });

/* ===================== 家庭カードを配る ===================== */
function startGame() {
  heavyOn = $("heavyToggle").checked;
  const rows = [...$("playerInputs").children];
  const famDeck = R.shuffle([...R.FAMILIES]);
  /* どんな人数でも、ウガンダの遺児家庭(w5/w6のどちらか)が必ず1枚は配られる */
  const dealN = Math.min(rows.length, famDeck.length);
  if (!famDeck.slice(0, dealN).some(f => f.id === "w5" || f.id === "w6")) {
    const oi = famDeck.findIndex(f => f.id === "w5" || f.id === "w6");
    const ti = Math.floor(Math.random() * dealN);
    [famDeck[ti], famDeck[oi]] = [famDeck[oi], famDeck[ti]];
  }
  players = rows.map((r, i) => {
    const name = r.querySelector("input").value.trim() || `${ja() ? "プレイヤー" : "Player "}${i + 1}`;
    const fam = famDeck[i % famDeck.length];
    const learn0 = 1 + ((fam.perk === "kinben" || fam.perk === "kokusai") ? 1 : 0);
    return {
      id: "p" + i, name, color: R.PCOLORS[i], fam, perk: fam.perk, hidden: [...fam.hide],
      pos: 0, money: fam.money, initMoney: fam.money, allow: fam.allow,
      learn: learn0, initLearn: learn0, happy: 0,
      mult: fam.rural ? 5 : 10, aai: false, univ: false, loan: 0,
      open: 0, locked: 0, unseen: 0, doorLog: [],
      shienDiscount: false, shienUsed: false, deaiUsed: false,
      hadHeavy: false, disasterTurns: 0, letterIn: null, wageShown: false,
      done: false, rankAt: null,
    };
  });
  R.assignChars(players);                           /* 家庭に合った見た目と色をくばる */
  turn = 0; deck = []; pending = null; busy = false; famIdx = 0;
  showScreen("game");
  window.scrollTo(0, 0);
  renderBoard(); renderTokens(); updateTurnUI();
  dealCard(0);
}

/* 折れ線を、角だけ丸めた細かい点列に変える */
function densePath(lay) {
  const P = lay.pts, Rr = lay.corner, out = [];
  const unit = (a, b) => { const d = [b[0]-a[0], b[1]-a[1]]; const n = Math.hypot(d[0], d[1]); return [d[0]/n, d[1]/n, n]; };
  let cur = P[0].slice();
  for (let i = 1; i < P.length; i++) {
    const v = P[i], [ux, uy, len] = unit(cur, v), hasCorner = i < P.length - 1;
    const stop = hasCorner ? Math.max(0, len - Rr) : len;
    const n = Math.max(2, Math.round(stop / 6));
    for (let k = 0; k <= n; k++) out.push([cur[0] + ux*stop*k/n, cur[1] + uy*stop*k/n]);
    if (hasCorner) {
      const [wx, wy] = unit(v, P[i+1]);
      const s = [cur[0] + ux*stop, cur[1] + uy*stop], e = [v[0] + wx*Rr, v[1] + wy*Rr], m = 40;
      for (let k = 1; k <= m; k++) {
        const t = k/m, it = 1-t;
        out.push([it*it*s[0] + 2*it*t*v[0] + t*t*e[0], it*it*s[1] + 2*it*t*v[1] + t*t*e[1]]);
      }
      cur = e;
    }
  }
  return out;
}
function buildGeo(lay) {
  const D = densePath(lay), cum = [0];
  for (let i = 1; i < D.length; i++) cum.push(cum[i-1] + Math.hypot(D[i][0]-D[i-1][0], D[i][1]-D[i-1][1]));
  const total = cum[cum.length - 1];
  const at = s => {
    let lo = 0, hi = cum.length - 1;
    while (lo < hi - 1) { const m = (lo + hi) >> 1; if (cum[m] < s) lo = m; else hi = m; }
    const t = (s - cum[lo]) / Math.max(1e-6, cum[hi] - cum[lo]);
    const p = [D[lo][0] + (D[hi][0]-D[lo][0])*t, D[lo][1] + (D[hi][1]-D[lo][1])*t];
    const a = D[Math.max(0, lo-2)], b = D[Math.min(D.length-1, hi+2)];
    const dx = b[0]-a[0], dy = b[1]-a[1], n = Math.hypot(dx, dy) || 1;
    return { p, n: [-dy/n, dx/n] };
  };
  return { lay, at, seg: total / M.SQUARES.length };
}

function drawScenery(svg, lay) {
  const [W, H] = lay.vb, artH = lay.artH, cloudH = lay.skyH;
  const defs = el("defs");
  const grad = el("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 });
  [["0%", "#DAEDFA"], [`${Math.round(artH / H * 62)}%`, "#E2F1F6"],
   [`${Math.round(artH / H * 108)}%`, "#EAF5EE"], ["100%", "#E3F2D8"]].forEach(([o, c]) =>
    grad.appendChild(el("stop", { offset: o, "stop-color": c })));
  defs.appendChild(grad); svg.appendChild(defs);
  svg.appendChild(el("rect", { width: W, height: H, fill: "url(#sky)" }));

  const g = el("g", {}), add = (t, a) => g.appendChild(el(t, a));
  add("circle", { cx: W * 0.93, cy: cloudH * 0.34, r: cloudH * 0.22, fill: "#FFE49A" });
  [0.1, 0.34, 0.6, 0.78].forEach(f => {

    add("ellipse", { cx: cx - rx * 0.6, cy: cy + ry * 0.5, rx: rx * 0.62, ry: ry * 0.8, fill: "#fff", opacity: .9 });
  });
  const k = artH / 124;
  SCENES.forEach(sc => {

    const sg = el("g", { transform: `translate(${cx.toFixed(1)} ${artH}) scale(${k.toFixed(3)})`, opacity: .92 });
    sc.draw((t, a) => sg.appendChild(el(t, a)));

    add("path", { d: `M${tx} ${ty} v${16*sz}`, stroke: "#A98363", "stroke-width": 4.5*sz, "stroke-linecap": "round" });
    add("circle", { cx: tx, cy: ty - 5*sz, r: 13*sz, fill: "#93C58F" });

}

/* 高さ y のところで、その形の中にとれる「いちばん長い横の線」。無ければ null */
function widestSpan(poly, y) {
  const xs = [];
  for (let k = 0; k < poly.length; k++) {
    const [x0, y0] = poly[k], [x1, y1] = poly[(k + 1) % poly.length];
    if ((y0 <= y && y1 > y) || (y1 <= y && y0 > y)) xs.push(x0 + (x1 - x0) * (y - y0) / (y1 - y0));
  }
  if (xs.length < 2) return null;
  xs.sort((a, b) => a - b);
  let best = null;
  for (let k = 0; k + 1 < xs.length; k += 2)
    if (!best || xs[k + 1] - xs[k] > best[1] - best[0]) best = [xs[k], xs[k + 1]];
  return best;
}
/* 横位置 x のところで、yRef をふくむ「ひとつづきの縦のひろがり」。無ければ null */
function vSpanAt(poly, x, yRef) {
  const ys = [];
  for (let k = 0; k < poly.length; k++) {
    const [x0, y0] = poly[k], [x1, y1] = poly[(k + 1) % poly.length];
    if ((x0 <= x && x1 > x) || (x1 <= x && x0 > x)) ys.push(y0 + (y1 - y0) * (x - x0) / (x1 - x0));
  }
  if (ys.length < 2) return null;
  ys.sort((a, b) => a - b);
  for (let k = 0; k + 1 < ys.length; k += 2)
    if (yRef >= ys[k] - 1 && yRef <= ys[k + 1] + 1) return [ys[k], ys[k + 1]];
  return null;
}
/* マスの中で、文字のかたまりがいちばん広く入る場所をさがす */
function bestLabelSpot(poly, offs) {
  const ys = poly.map(q => q[1]);
  const top = Math.min(...ys), bot = Math.max(...ys), N = 30;
  const probes = [];
  offs.forEach(o => { probes.push(o - 12, o + 4); });
  const cand = [];
  for (let i = 0; i <= N; i++) {
    const ay = top + (bot - top) * i / N;
    let lo = -Infinity, hi = Infinity;
    for (const o of probes) {
      const sp = widestSpan(poly, ay + o);
      if (!sp) { lo = 0; hi = -1; break; }
      lo = Math.max(lo, sp[0]); hi = Math.min(hi, sp[1]);
    }
    if (hi - lo > 0) cand.push({ x: (lo + hi) / 2, y: ay, w: hi - lo });
  }
  if (!cand.length) return null;
  const max = Math.max(...cand.map(c => c.w));
  const tie = cand.filter(c => c.w >= max - 1);
  return tie[Math.floor(tie.length / 2)];
}
/* 横位置 x のところで、その形が上下どこからどこまであるか。無ければ null */
function spanAtX(poly, x) {
  const ys = [];
  for (let k = 0; k < poly.length; k++) {
    const [x0, y0] = poly[k], [x1, y1] = poly[(k + 1) % poly.length];
    if ((x0 <= x && x1 > x) || (x1 <= x && x0 > x)) ys.push(y0 + (y1 - y0) * (x - x0) / (x1 - x0));
  }
  return ys.length ? [Math.min(...ys), Math.max(...ys)] : null;
}

/* マスのアイコンの上下のひろがり（線の太さこみ） */
const ICON_Y = {
  income: [-12, 12], cost: [-15, 16], event: [-16, 18], heavy: [-16, 18], learn: [-10, 11],
  choice: [-21, 17], start: [-9, 9], goal: [-12, 16], talk: [-14, 15], fam: [-12, 12],
};
function tileIcon(type, cx, cy, c) {

  } else if (type === "learn") {
    a("path", { d: "M-13 -8 h11 a2 2 0 0 1 2 2 v15 a2 2 0 0 0 -2 -2 h-11 z", fill: "#fff", stroke: c, "stroke-width": 2.8, "stroke-linejoin": "round" });
    a("path", { d: "M13 -8 h-11 a2 2 0 0 0 -2 2 v15 a2 2 0 0 1 2 -2 h11 z", fill: "#DCEEF9", stroke: c, "stroke-width": 2.8, "stroke-linejoin": "round" });
  } else if (type === "choice") {
    a("path", { d: "M-12 15 v-22 a12 12 0 0 1 24 0 v22 z", fill: "#fff", stroke: "#D4547A", "stroke-width": 3, "stroke-linejoin": "round" });
    a("circle", { cx: 6, cy: 5, r: 2.6, fill: "#D4547A" });
  } else if (type === "start") {

function renderBoard() {
  const lay = mqMobile.matches ? LAY_TALL : LAY_WIDE;
  document.documentElement.style.setProperty("--board-aspect", String(lay.aspect || 1.386));
  geo = buildGeo(lay);
  const svg = $("board");
  svg.setAttribute("viewBox", `0 0 ${lay.vb[0]} ${lay.vb[1]}`);
  svg.innerHTML = "";
  drawScenery(svg, lay);

  const gTiles = el("g", {}), gLabels = el("g", {});
  svg.appendChild(gTiles); svg.appendChild(gLabels);
  const { at, seg } = geo;
  const band = [];                                      /* 各マスの上下端。章ラベルの位置決めに使う */

  M.SQUARES.forEach((sq, i) => {
    const m = R.TYPE_META[sq.t], hw = halfW(sq.t);
    const s0 = i * seg + 3.5, s1 = (i + 1) * seg - 3.5, STEPS = 22, left = [], right = [], mid = [];
    for (let k = 0; k <= STEPS; k++) {
      const { p, n } = at(s0 + (s1 - s0) * k / STEPS);
      left.push([p[0] + n[0]*hw, p[1] + n[1]*hw]);
      right.push([p[0] - n[0]*hw, p[1] - n[1]*hw]);
      mid.push(p);
    }
    const d = "M" + left.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ")
      + " L " + right.reverse().map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L ") + " Z";
    gTiles.appendChild(el("path", { d, id: `sq-${i}`, fill: m.fill, stroke: "#FFFFFF", "stroke-width": 9, "stroke-linejoin": "round" }));

    const poly = left.concat(right);
    const big = sq.t === "choice" || sq.t === "start" || sq.t === "goal";
    const tTxt = L(sq.name) || L(m.label);
    /* 年齢はトビラ・スタート・ゴールだけ。せまい画面では説明文は出さない */
    const ageTxt = ja() ? `${M.AGES[i]}歳` : `Age ${M.AGES[i]}`;
    let sTxt = big
      ? ageTxt + (L(sq.sub) ? "・" + L(sq.sub) : "")
      : (lay.sub ? (L(sq.sub) || "") : "");
    const iy = ICON_Y[sq.t] || [-12, 12];
    const oIcon = -(big ? 30 : 26), oTitle = (big ? 12 : 10), oSub = (big ? 32 : 28);
    const blockTop = oIcon + iy[0], blockBot = sTxt ? oSub + 3 : oTitle + 4;
    const dy = -(blockTop + blockBot) / 2;
    const offs = [oIcon + dy, oTitle + dy];
    if (sTxt) offs.push(oSub + dy);
    const spot = bestLabelSpot(poly, offs)
      || { x: mid[Math.floor(mid.length / 2)][0], y: mid[Math.floor(mid.length / 2)][1], w: 2 * hw };
    const vSpan = vSpanAt(poly, spot.x, spot.y);
    if (vSpan) spot.y = (vSpan[0] + vSpan[1]) / 2;
    /* 1行ごとに、その高さで使える幅を測る。曲がったマスでも白いフチをまたがない */
    const roomAt = ys => {
      let room = Infinity;
      for (const y of ys) {
        const sp = widestSpan(poly, y);
        room = Math.min(room, sp ? 2 * Math.min(spot.x - sp[0], sp[1] - spot.x) : 0);
      }
      return Math.max(46, room - 24);
    };
    const fit = (txt, base, ys) => {
      const w = [...txt].reduce((s2, ch) => s2 + (ch.charCodeAt(0) > 0x2E80 ? 1 : 0.55), 0);
      return Math.min(base, roomAt(ys) / Math.max(1, w));
    };
    gLabels.appendChild(tileIcon(sq.t, spot.x, spot.y + offs[0], m.chip));
    const yT = spot.y + offs[1];
    const title = el("text", { x: spot.x, y: yT, "text-anchor": "middle",
      "font-size": Math.max(10, fit(tTxt, big ? lay.fsBig : lay.fsSmall, [yT, yT - 14])),
      "font-weight": 900, fill: m.ink });
    title.textContent = tTxt;
    gLabels.appendChild(title);
    if (sTxt) {
      const yS = spot.y + offs[2], probes = [yS, yS - 9];
      let fs = fit(sTxt, big ? (lay.sub ? 12 : 12.5) : 11, probes);
      if (fs < 9.8 && big && sTxt !== ageTxt) { sTxt = ageTxt; fs = fit(sTxt, 12, probes); }
      if (fs >= 9.8) {
        const sub = el("text", { x: spot.x, y: yS, "text-anchor": "middle",
          "font-size": fs, "font-weight": 700,
          fill: big ? m.ink : "#6E7E8C", opacity: big ? .92 : 1 });
        sub.textContent = sTxt;
        gLabels.appendChild(sub);
      }
    }
    band[i] = poly;
  });

  /* 章のラベルは、段と段のあいだの「ほんとうに空いているところ」のまん中に置く */
  const cx = lay.vb[0] / 2, perRow = lay.sub ? 6 : 3;
  const spans = band.map(poly => spanAtX(poly, cx));
  M.CHAPTERS.forEach((ch, r) => {
    const first = r * 6;
    const tops = spans.slice(first, first + perRow).filter(Boolean).map(v => v[0] - 4.5);
    const bots = spans.slice(0, first).filter(Boolean).map(v => v[1] + 4.5);
    const top = tops.length ? Math.min(...tops) : 40;
    const y = bots.length
      ? (Math.max(...bots) + top) / 2
      : Math.max(16, top - 30);
    const t = L(ch.t);
    const w = Math.min(lay.vb[0] - 24, t.length * (lay.sub ? 14 : 15) + 24);
    gLabels.appendChild(el("rect", { x: cx - w/2, y: y - 13, width: w, height: 26, rx: 13,
      fill: "#fff", opacity: .95, stroke: "#DCE7EE", "stroke-width": 2 }));
    const e = el("text", { x: cx, y: y + 5, "font-size": lay.sub ? 13.5 : 14.5, "font-weight": 900,
      fill: "#3F5266", "text-anchor": "middle" });
    e.textContent = t;
    gLabels.appendChild(e);
  });

  svg.appendChild(el("g", { id: "tokLayer" }));
}

/* コマの表情。数字の変化ではなく「いまの状態」をあらわす */
function emotionOf(p, isTurn) {
  if (p.money < 0) return "sad";
  if (p.done) return "joy";
  return isTurn ? "fun" : "joy";
}
function renderTokens() {
  const layer = $("tokLayer");
  if (!layer || !geo) return;
  layer.innerHTML = "";
  const { at, seg, lay } = geo;
  /* 同じマスに重なったときは、少しずつ横にずらす */
  const bucket = {};
  players.forEach(p => (bucket[p.pos] = bucket[p.pos] || []).push(p));
  Object.entries(bucket).forEach(([posStr, list]) => {
    const pos = +posStr;
    const sq = M.SQUARES[pos]; if (!sq) return;
    const { p: c, n } = at(pos * seg + seg / 2);
    const hw = halfW(sq.t);
    const sg = n[1] < 0 ? 1 : -1;
    const base = [c[0] + n[0]*sg*(hw - 6), c[1] + n[1]*sg*(hw - 6)];
    const W = lay.tokenW, H = lay.tokenH;
    list.forEach((p, k) => {
      const off = (k - (list.length - 1) / 2) * (W * 0.52);
      const foot = [base[0] + off, base[1] - Math.abs(off) * 0.12];
      const g = el("g", { id: `tok-${p.id}` });
      g.appendChild(el("ellipse", { cx: foot[0], cy: foot[1] - 1, rx: 15, ry: 5, fill: "rgba(63,82,102,.18)" }));
      const isTurn = players[turn] === p && !p.done && famIdx === null;
      /* オンライン版の「あなた」の札のかわりに、いまの手番の人の名前を出す */
      if (isTurn) {
        const w = Math.min(150, [...p.name].reduce((s, ch) => s + (ch.charCodeAt(0) > 0x2E80 ? 13 : 7.5), 0) + 22);
        g.appendChild(el("rect", { x: foot[0] - w/2, y: foot[1] - H - 23, width: w, height: 22, rx: 11, fill: p.color }));
        const t = el("text", { x: foot[0], y: foot[1] - H - 8, "text-anchor": "middle",
          "font-size": 12.5, "font-weight": 900, fill: "#fff" });
        t.textContent = p.name;
        g.appendChild(t);
      }
      const img = el("image", {
        href: `./chars/${charOf(p)}-${emotionOf(p, isTurn)}.png`,
        x: foot[0] - W/2, y: foot[1] - H, width: W, height: H,
        preserveAspectRatio: "xMidYMax meet",
        opacity: isTurn || famIdx !== null ? 1 : .82,
      });
      img.style.filter = "drop-shadow(0 1px 2px rgba(63,82,102,.3))";
      g.appendChild(img);
      layer.appendChild(g);
    });
  });
  /* 手番の人のコマを、いちばん手前に描く */
  const cur = players[turn] && $(`tok-${players[turn].id}`);
  if (cur) layer.appendChild(cur);
}
function focusSquare(pos) {

  window.scrollTo({ top: Math.max(0, r.top + window.scrollY - (window.innerHeight - r.height) / 2), behavior: "smooth" });
}

/* ===================== サイコロ ===================== */
const PIPS = {1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8]};
let spinTimer = null;
function diceFace(n, box) {
  const on = new Set(PIPS[n] || []);
  (box || $("diceFace")).innerHTML = Array.from({ length: 9 }, (_, i) => on.has(i) ? "<span><i></i></span>" : "<span></span>").join("");
}
const MIN_ROLL = 900, HOLD = 820;                /* 着地の回りこみ(.6s)を見せてから閉じる */
/* その目の面が正面を向くように、本体を回す向き。CSSの .f1〜.f6 の置き方と対になっている */
const FACE_ROT = {
  1: "rotateX(0deg) rotateY(0deg)", 2: "rotateX(0deg) rotateY(-90deg)",
  3: "rotateX(-90deg) rotateY(0deg)", 4: "rotateX(90deg) rotateY(0deg)",
  5: "rotateX(0deg) rotateY(90deg)", 6: "rotateX(0deg) rotateY(180deg)",
};
function buildBigDie(die) {
  if (die.childElementCount) return;
  for (let n = 1; n <= 6; n++) {
    const face = document.createElement("div");
    face.className = "face f" + n;
    diceFace(n, face);
    die.appendChild(face);
  }
}
/* 画面中央の大きなサイコロを転がして、n の目で着地させる */
function rollBigDice(n) {
  return new Promise(res => {
    const stage = $("diceStage"), scene = $("dieScene"), die = $("bigDie");
    buildBigDie(die);
    stage.classList.add("on");
    scene.classList.remove("land");
    die.classList.remove("land"); die.style.transform = ""; die.classList.add("roll");
    $("dieMsg").textContent = "";
    se("roll");
    spinTimer = setInterval(() => diceFace(1 + Math.floor(Math.random() * 6)), 80);
    setTimeout(() => {
      clearInterval(spinTimer); spinTimer = null;
      /* 回っている途中の向きをいったん固定してから着地の向きへ動かす */
      const mid = getComputedStyle(die).transform;
      die.classList.remove("roll");
      die.style.transition = "none";
      die.style.transform = mid;
      void die.offsetWidth;
      die.style.transition = "";
      die.classList.add("land");
      die.style.transform = FACE_ROT[n] || FACE_ROT[1];
      scene.classList.add("land");
      diceFace(n);
      se("land");
      $("dieMsg").textContent = ja() ? `${n} マスすすむ！` : `Move ${n}!`;
      setTimeout(() => { stage.classList.remove("on"); res(); }, HOLD);
    }, MIN_ROLL);
  });
}
$("diceBtn").onclick = async () => {
  const p = players[turn];
  if (busy || pending || famIdx !== null || !p || p.done) return;
  busy = true; updateTurnUI();
  /* 子ども時代(進学の手前まで)はサイコロを使わず1マスずつ */
  const child = p.pos < 4;
  const steps = child ? 1 : 1 + Math.floor(Math.random() * 6);
  if (!child) await rollBigDice(steps);
  let target = Math.min(p.pos + steps, M.SQUARES.length - 1);
  for (let i = p.pos + 1; i < target; i++) {
    if (M.SQUARES[i].stop) { target = i; break; }
  }
  while (p.pos < target) {
    p.pos++;
    se("step");
    renderTokens();
    focusSquare(p.pos);
    await wait(200);
  }
  await wait(150);
  busy = false;
  updateTurnUI();
  resolveSquare();
};

/* ===================== ターンの流れ =====================
   オンライン版のサーバー(src/index.js の Room)と同じ判定。
   できごとはいったん pending に入れ、OK や選択で反映してからターンを終える。 */
function beginTurn() {
  pending = null;
  const p = players[turn];
  updateTurnUI(); renderTokens();
  focusSquare(p.pos);
  if (p.letterIn !== null) {
    p.letterIn--;
    if (p.letterIn <= 0) { p.letterIn = null; setChoice(R.letterDef(), "heavy", true); renderPending(); }
  }
}
function endTurn() {
  const cur = players[turn];
  if (cur.disasterTurns > 0) cur.disasterTurns--;
  pending = null;
  closeModal();
  renderTokens();
  if (players.every(x => x.done)) { showResult(); return; }
  do { turn = (turn + 1) % players.length; } while (players[turn].done);
  beginTurn();
}

function setInfo(type, title, body, fx, note, pnote) {
  pending = { kind: "info", type, title, body, note: note || null, pnote: pnote || null, fx: fx || {} };
}
function setChoice(def, type, skipCount) {
  const p = players[turn];
  const states = def.opts.map(o => {
    if (o.tag && p.hidden.includes(o.tag)) return "unseen";
    return R.meetsReq(p, o) ? "open" : "locked";
  });
  if (!skipCount) {
    states.forEach(s => { if (s === "unseen") p.unseen++; else if (s === "open") p.open++; else p.locked++; });
    p.doorLog.push({ title: def.title, variant: def.variant, age: M.AGES[p.pos], opts: def.opts, states, chosen: null });
    logged = true;
  } else logged = false;
  pending = { kind: "choice", type: type || "choice", def: { title: def.title, body: def.body, variant: def.variant, heavy: !!def.heavy },
              opts: def.opts, states };
}

function resolveSquare() {
  const p = players[turn], sq = M.SQUARES[p.pos];
  if (sq.t === "income") {
    if (sq.fixed != null) {
      setInfo("income", sq.name, bi("はじめての、自分のかせぎ！", "Your first money of your own!"), { money: sq.fixed });
    } else {
      let amt = p.fam.wage + p.learn * p.mult + p.allow;
      const job = R.jobTitle(p);
      const title = bi(`${job.ic} ${M.AGES[p.pos]}歳・いまのしごと：${job.t.ja}`, `${job.ic} Age ${M.AGES[p.pos]} · Current job: ${job.t.en}`);
      /* 毎回変わる情報（災害・返済）は、かならず本文に出す */
      let extra = null;
      if (p.disasterTurns > 0) {
        amt -= 10;
        extra = join(extra, bi(`⚠️ 災害の影響で −10万（あと${p.disasterTurns}ターン）`, `⚠️ Disaster: −${fmEn(10)} (${p.disasterTurns} turns left)`));
      }
      if (p.loan > 0) {
        const pay = Math.min(6, p.loan);
        p.loan -= pay; amt -= pay;
        extra = join(extra, bi(`🎓 奨学金の返済 −${pay}万（のこり${p.loan}万）`, `🎓 Scholarship repayment −${fmEn(pay)} (${fmEn(p.loan)} left)`));
      }
      if (!p.wageShown) {
        /* かせぎの式と「生まれた場所で基本給がちがう」は学びの核なので、最初の1回はじっくり見せる */
        p.wageShown = true;
        let note = bi(
          `かせぎは <b>基本給${fmJa(p.fam.wage)} ＋ まなび×${fmJa(p.mult)}${p.allow > 0 ? " ＋ 仕送り" + fmJa(p.allow) : ""}</b><br>まなびが増えると、しごともかせぎも変わっていく`,
          `Pay = <b>base ${fmEn(p.fam.wage)} + Learn × ${fmEn(p.mult)}${p.allow > 0 ? " + allowance " + fmEn(p.allow) : ""}</b><br>As learning grows, your job and pay change too`);
        if (p.fam.wage < 20) note = join(note, bi(
          `🌍 同じはたらきでも、生まれた場所で基本給はちがう——<br>じつは現実のウガンダの平均収入は、日本の<b>約20分の1</b>。このゲームでは、いっしょに遊べるように差をゆるめている。`,
          `🌍 Same work, different base pay — it depends on where you were born.<br>In reality, average income in Uganda is about <b>1/20th</b> of Japan's. This game softens the gap so everyone can play the same board.`));
        if (p.mult < 10) note = join(note, bi(
          `📉 いまの場所では、まなびがかせぎにつながりにくい（★×5万）。<b>スキルが活きる場</b>につながるトビラがあれば——`,
          `📉 Where you live, learning hardly turns into pay (★×${fmEn(5)}). If only a door led to <b>a place where skills matter</b>—`));
        if (extra) note = join(note, extra);
        setInfo("income", title, note, { money: amt });
      } else {
        /* 2回目からは式だけ。1回目の長い説明はくり返さない */
        const body = bi(
          `かせぎ ＝ 基本給${fmJa(p.fam.wage)} ＋ まなび★${p.learn}×${fmJa(p.mult)}${p.allow > 0 ? " ＋ 仕送り" + fmJa(p.allow) : ""}`,
          `Pay = base ${fmEn(p.fam.wage)} + Learn ★${p.learn} × ${fmEn(p.mult)}${p.allow > 0 ? " + allowance " + fmEn(p.allow) : ""}`);
        setInfo("income", title, body, { money: amt }, extra);
      }
    }
  }
  else if (sq.t === "cost") {
    setInfo("cost", sq.name, bi("生きているとお金はかかる。固定費、だいじ。", "Living costs money. Watch those fixed costs."), { money: -sq.amt });
  }
  else if (sq.t === "event") {
    /* skipCount=true：ライフイベントはトビラではないので、結果発表の「出会ったトビラ」には数えない */
    if (heavyOn && !p.hadHeavy && p.pos >= M.heavyFrom && Math.random() < 0.3) setChoice(R.heavyDef(p), "heavy", true);
    else if (!drawEvent()) return endTurn();
  }
  else if (sq.t === "learn") setChoice(R.choiceDef("learnSq", p, M), "learn");
  else if (sq.t === "choice") setChoice(R.choiceDef(sq.key, p, M), "choice");
  else if (sq.t === "goal") {
    p.done = true;
    p.rankAt = players.filter(x => x.done).length;
    /* 35歳のゴールで、のこった奨学金を一括清算する（MODES.full.settleLoan） */
    pending = { kind: "goal", rankAt: p.rankAt, loan: p.loan,
                fx: { happy: p.rankAt === 1 ? 1 : 0, money: (M.settleLoan && p.loan > 0) ? -p.loan : 0 } };
  }
  else return endTurn();
  renderPending();
}

/* できごとカードを1枚引く。引けなかったら false */
function drawEvent() {
  const p = players[turn];
  let ev = null, guard = 0;
  while (guard++ < 40) {
    if (!deck.length) deck = R.shuffle(R.EVENTS.map((_, i) => i));
    const cand = R.EVENTS[deck.pop()];
    if (cand.only === "rural" && !p.fam.rural) continue;
    if (cand.only === "rich" && p.fam.rural) continue;
    if ((cand.kind === "info" || cand.kind === "fair") && p.hidden.length === 0) continue;
    ev = cand; break;
  }
  if (!ev) return false;
  if (ev.kind === "info") {
    /* 数えるのはタグの数ではなく、これから出会う選択肢の数 */
    const before = R.hiddenOptionCount(p, p.pos, M);
    R.revealTags(p, ev.reveal, p.perk === "tasukeai" ? 2 : 1);
    const revealed = before - R.hiddenOptionCount(p, p.pos, M);
    let pnote = revealed > 0
      ? bi(`👁 見えていなかった選択肢が <b>${revealed}個</b>、見えるようになった！`, `👁 <b>${revealed}</b> hidden option${revealed > 1 ? "s" : ""} became visible!`)
      : null;
    const dn = R.checkDeai(p);
    if (dn) pnote = pnote ? join(pnote, dn) : dn;
    setInfo("event", ev.t, ev.d, {}, null, pnote);
  }
  else if (ev.kind === "fair") setChoice(R.fairDef(), "event");
  else setInfo("event", ev.t, ev.d, { ...ev.fx });
  return true;
}

function applyChoice(i) {
  const p = players[turn], o = pending.opts[i];
  /* 開けられる扉がひとつもないときの「今回は見送る」(i=-1) */
  if (i < 0) { if (!pending.states.includes("open")) endTurn(); return; }
  if (!o || pending.states[i] !== "open") return;
  if (logged && p.doorLog.length) p.doorLog[p.doorLog.length - 1].chosen = i;
  const fx = { ...o.fx };
  const notes = [];                                  /* できごとの説明 */
  const pnotes = [];                                 /* 見え方・家庭カードの強み（オンライン版では本人だけに出すもの） */
  if (fx.money) {
    fx.money = R.effectiveMoneyFx(p, o);
    if (fx.money !== o.fx.money && o.special !== "shogakukin") {
      notes.push(bi(`🎗 サポートのおかげで、はらうお金が <b>${fmJa(o.fx.money)} → ${fmJa(fx.money)}</b> に軽くなった。`,
                    `🎗 Thanks to the support, what you pay drops from <b>${fmEn(o.fx.money)} to ${fmEn(fx.money)}</b>.`));
    }
  }
  if (o.special === "revealAll" && p.hidden.length > 0) {
    p.hidden.length = 0;
    pnotes.push(bi("👁 いままで見えていなかった選択肢が、ぜんぶ見えるようになった！", "👁 Every hidden option is now visible!"));
    const dn = R.checkDeai(p); if (dn) pnotes.push(dn);
  }
  if (o.special === "reveal2") {
    const before = R.hiddenOptionCount(p, p.pos, M);
    R.revealTags(p, "any", p.perk === "tasukeai" ? 4 : 2);
    const n = before - R.hiddenOptionCount(p, p.pos, M);
    if (n > 0) pnotes.push(bi(`👁 見えていなかった選択肢が <b>${n}個</b>、見えるようになった！`, `👁 <b>${n}</b> hidden option${n > 1 ? "s" : ""} became visible!`));
    const dn = R.checkDeai(p); if (dn) pnotes.push(dn);
  }
  if (o.special === "shienSupport") {
    p.shienDiscount = true;
    R.unhideTag(p, "shien");
    notes.push(bi("🎗 これから先、支援・まなび系のトビラが <b>最大50万ぶん安くなる</b>。カギ（必要なお金）も、じっさいにはらうお金も。",
                  `🎗 From now on, aid/learning doors cost up to <b>${fmEn(50)} less</b> — both the key you need and the money you actually pay.`));
    const dn = R.checkDeai(p); if (dn) pnotes.push(dn);
  }
  if (o.special === "letter") p.letterIn = 2;
  if (o.unlock && p.mult < 10) {
    p.mult = 10;
    notes.push(bi("🔓 スキルが活きる場につながった！ これから、まなびが <b>★×10万</b> でかせぎになる。",
                  `🔓 You reached a place where skills pay! Learning now earns <b>★×${fmEn(10)}</b>.`));
  }
  if (o.special === "aai") {
    p.aai = true;
    /* 「ぜんぶ」の盤面には、このあと30歳ごろに「大きな夢」のトビラがある */
    notes.push(bi("🤝 AAIは『志』の奨学金——卒業したら、リーダーシップで祖国に貢献する約束。あなたの「大きな夢」は、祖国とともにある。",
                  "🤝 AAI is a scholarship of purpose — a promise to lead and give back to your home country. Your \"big dream\" now belongs with your homeland."));
  }
  if (o.special === "shogakukin") {
    if (p.shienDiscount || p.perk === "shienPro") {
      notes.push(bi("🎗 支援を知っていたおかげで<b>返さなくていい奨学金</b>に出会えた！", "🎗 Because you knew the support system, you found <b>a scholarship you never repay</b>!"));
    } else {
      p.loan = 48;
      notes.push(bi(`🎓 これは<b>貸与型</b>（総額48万）。働きはじめたら、かせぎから<b>すこしずつ（−6万）</b>、${lastAge()}歳まで返していく。`,
                    `🎓 This is <b>a loan</b> (${fmEn(48)} total). Once you work, you repay <b>bit by bit (−${fmEn(6)})</b> until you're ${lastAge()}.`));
    }
  }
  if (o.tag === "shien" && p.perk === "shienPro" && !p.shienUsed) {
    p.shienUsed = true;
    fx.learn = (fx.learn || 0) + 1;
    pnotes.push(bi("✨ 支援を知っている強みで まなび+1", "✨ Knowing the support system: Learn +1"));
  }
  /* 「えらんできたこと」に出すのは、実際にきいた効果のほう */
  if (logged && p.doorLog.length) p.doorLog[p.doorLog.length - 1].appliedFx = { ...fx };
  pending = { kind: "result", type: pending.type, title: o.t, body: o.d, notes, pnotes, fx };
  renderPending();
}

/* info / result / goal のOKで、効果を反映してターンを終える */
function confirmPending() {
  const p = players[turn], pd = pending;
  if (!pd) return;
  if (pd.kind === "goal") {
    if (p.rankAt === 1) p.happy += 1;
    if (M.settleLoan && p.loan > 0) { p.money -= p.loan; p.loan = 0; }
  } else if (pd.kind === "info" || pd.kind === "result") {
    R.applyFx(p, pd.fx || {});
  } else return;                                   /* choice はボタンで決める */
  endTurn();
}

/* ===================== できごとの画面 ===================== */
const tagChip = (type, label) => {
  const m = R.TYPE_META[type] || R.TYPE_META.event;
  return `<span class="m-tag" style="background:${m.chip}">${ic(m.icon, "s")} ${label != null ? label : L(m.label)}</span>`;
};
/* ステータスがどう変わったかを、前後の数字で見せる */
function chgPanel(p, fx) {
  const rows = [
    ["money", ja() ? "おかね" : "Money", p.money, fx.money || 0, v => fm(v)],
    ["learn", ja() ? "まなび" : "Learn", p.learn, fx.learn || 0, v => "★" + v],
    ["happy", ja() ? "ハッピー" : "Happy", p.happy, fx.happy || 0, v => "♥" + v],
  ].filter(r => r[3] !== 0);
  if (!rows.length) return `<div class="fx-line"><span class="fx">${ja() ? "数字は変わらなかった" : "No change"}</span></div>`;
  const emo = (fx.happy || 0) > 0 ? "joy" : ((fx.money || 0) > 0 || (fx.learn || 0) > 0 ? "fun" : "sad");
  return `<div class="chg-body">
    <div class="chg-char" style="background-image:url(./chars/${charOf(p)}-${emo}.png)"></div>
    <div class="chg-rows">${rows.map(([k, label, base, d, f]) => `
      <div class="chg-r ${k}"><span class="k">${label}</span>
        <span class="v"><s>${f(base)}</s>${f(base + d)}</span>
        <span class="d ${d > 0 ? "up" : "dn"}">${d > 0 ? "+" : ""}${k === "money" ? fm(d) : d}</span></div>`).join("")}
    </div></div>`;
}
/* おかね・まなびは文字で書かず、画面上のプレイヤーカードと同じ色のアイコンだけで示す */
const money = n => `<span class="m1">${ic("coin", "s")}${fm(n)}</span>`;
const learn = n => `<span class="m2">${ic("star", "s")}${n}</span>`;
function reqLabel(p, o) {
  const parts = [];
  if (o.req.univ) parts.push(ja() ? "大学を出ていること" : "a university degree");
  const em = R.effectiveMoneyReq(p, o), el2 = R.effectiveLearnReq(p, o);
  if (o.req.money) {
    const memo = [];
    if (p.shienDiscount && (o.tag === "shien" || o.tag === "manabi")) memo.push(ja() ? "支援サポートで−50万" : `aid support −${fm(50)}`);
    if (p.perk === "kokusai" && o.tag === "global") memo.push(ja() ? "国際感覚で−50万" : `global sense −${fm(50)}`);
    parts.push(money(em) + (memo.length ? `（${memo.join("・")}）` : ""));
  }
  if (o.req.learn) parts.push(learn(el2) + (el2 < o.req.learn ? (ja() ? "（英語ネイティブで−2）" : "（native English −2）") : ""));
  if (o.req.maxMoney != null) parts.push(ja() ? `所得制限 ${money(o.req.maxMoney)}未満` : `Income limit: under ${money(o.req.maxMoney)}`);
  return parts.join(" ＋ ");
}
const noteBox = (v, cls) => (v && (!Array.isArray(v) || v.length))
  ? `<div class="m-note${cls ? " " + cls : ""}">${(Array.isArray(v) ? v.map(L).join("<br>") : L(v))}</div>` : "";

/* 出てきた画面にあわせて鳴らす音を選ぶ。数字が増えるか減るかで、うれしい／つらいを分ける */
function pendingSe(pd) {
  if (pd.kind === "goal") return "goal";
  if (pd.kind === "choice") return "door";
  const fx = pd.fx || {};
  if ((fx.money || 0) < 0 || (fx.happy || 0) < 0) return "bad";
  if ((fx.money || 0) > 0 || (fx.learn || 0) > 0 || (fx.happy || 0) > 0) return "good";
  return pd.type === "heavy" ? "bad" : "pop";
}
/* 一覧に置くトビラの目じるし。奥のわくと手前の扉をかさねて、扉だけがひらくようにする */
const doorMark = () => `<span class="d-mark">
      <svg class="ic way" aria-hidden="true"><use href="#ic-doorway"/></svg>
      <svg class="ic leaf" aria-hidden="true"><use href="#ic-door-leaf"/></svg></span>`;

/* pending を画面に出す。restore() から呼びなおされることもあるので、何度呼んでも同じ画面になる */
let pendingShown = null;
function renderPending() {
  const pd = pending;
  if (!pd) return;
  const p = players[turn];
  if (pendingShown !== pd) { se(pendingSe(pd)); pendingShown = pd; }
  const type = pd.type === "heavy" ? "heavy" : (["learn", "event", "income", "cost"].includes(pd.type) ? pd.type : "choice");

  if (pd.kind === "info") {
    openModal(`<div class="m-head">
        ${tagChip(pd.type === "heavy" ? "heavy" : (R.TYPE_META[pd.type] ? pd.type : "event"))}
        <h2>${L(pd.title)}</h2></div>
      <div class="m-body">
        <p class="m-lead">${L(pd.body)}</p>
        ${noteBox(pd.note)}
        ${noteBox(pd.pnote, "priv")}
        ${chgPanel(p, pd.fx || {})}
        <button class="m-btn" id="mOk">OK</button>
      </div>`);
    $("mOk").onclick = confirmPending;
  }
  else if (pd.kind === "result") {
    openModal(`<div class="m-head">
        ${tagChip(type, ja() ? "えらんだ！" : "Chosen!")}
        <h2>${L(pd.title)}</h2></div>
      <div class="m-body">
        <p class="m-lead">${L(pd.body)}${ja() ? "。" : "."}</p>
        ${noteBox(pd.notes)}
        ${noteBox(pd.pnotes, "priv")}
        ${chgPanel(p, pd.fx || {})}
        <button class="m-btn" id="mOk">OK</button>
      </div>`);
    $("mOk").onclick = confirmPending;
  }
  else if (pd.kind === "choice") {
    /* 開くかどうか・いくらかかるかは、押すまで伏せておく。
       「どれを選びたいか」を先に考えてもらうため。押すと中身が開いて、最終確認になる */
    const openN = pd.states.filter(x => x === "open").length;
    /* 死別・干ばつなどのライフイベントは「トビラ」として数えないので、トビラの言い方をしない */
    const isDoor = pd.type !== "heavy";
    const stuck = openN === 0;
    /* 表示順はシャッフルする（いつも一番上＝高額、で無思考に選ばれるのを防ぐ）。
       data-i は元の並びのままなので、記録や一覧の集計はずれない */
    const order = pd.order || (pd.order = R.shuffle(pd.opts.map((_, i) => i)));
    const W = isDoor ? {
      ask: ja() ? "このトビラを開けますか？" : "Open this door?",
      yes: ja() ? "はい、このトビラを開ける" : "Yes, open it",
      backAgain: ja() ? "やっぱり、ほかのトビラを見る" : "Back to the other doors",
      back: ja() ? "ほかのトビラを見る" : "Back to the other doors",
      ng: ja() ? "……このトビラは開かなかった。" : " — this door didn't open.",
      pass: ja() ? "どれも開かない。今回は見送る" : "None will open — pass this time",
    } : {
      ask: ja() ? "これをえらびますか？" : "Choose this?",
      yes: ja() ? "はい、これにする" : "Yes, choose this",
      backAgain: ja() ? "やっぱり、ほかの選択肢を見る" : "Back to the other options",
      back: ja() ? "ほかの選択肢を見る" : "Back to the other options",
      ng: ja() ? "……これは選べなかった。" : " — you can't choose this.",
      pass: ja() ? "どれも選べない。今回は見送る" : "None can be chosen — pass this time",
    };
    const head = `<div class="m-head">
        ${tagChip(pd.def.heavy ? "heavy" : (pd.type === "learn" ? "learn" : (pd.type === "event" ? "event" : "choice")))}
        <h2>${L(pd.def.title)}</h2>
      </div>`;

    /* --- 一覧：どれも同じ見た目。名前だけを見て、開けにいくかどうかを決める --- */
    const listHtml = () => `<div class="m-body">
        <p class="m-lead">${L(pd.def.body)}</p>
        <div class="pcard now m-pcard" style="--ring:${p.color}">${playerCardBody(p)}</div>
        <div class="door-list">${order.map(i => {
          const o = pd.opts[i];
          if (pd.states[i] === "unseen") return `<button class="door unseen" disabled>
              ${isDoor ? `<span class="d-mark unseen">${ic("eye")}</span>` : ""}
              <span class="d-main"><span class="d-title">？？？</span>
                <span class="d-desc">${ja() ? "この選択肢は、見えない。" : "You can't see this option."}</span></span></button>`;
          return `<button class="door pick" data-i="${i}" data-se="off">
              ${isDoor ? doorMark() : ""}
              <span class="d-main"><span class="d-title">${L(o.t)}</span></span></button>`;
        }).join("")}</div>
      </div>`;

    /* --- 押したあと：中身・「でも、〜」・カギと金額を開いて、最後にもう一度たずねる --- */
    const confirmHtml = i => {
      const o = pd.opts[i], ok = pd.states[i] === "open";
      const key2 = reqLabel(p, o);
      const em = R.effectiveMoneyReq(p, o), raw = o.fx.money || 0, efx = R.effectiveMoneyFx(p, o);
      const cut = efx !== raw, redundant = o.req.money && efx === -em;
      const loan = o.special === "shogakukin" && !(p.shienDiscount || p.perk === "shienPro");
      const cost = ((efx || cut) && !redundant)
        ? `<div class="d-cost ${efx < 0 ? "minus" : "plus"}">${ic("coin", "s")} ${ja() ? "おかね" : "Money"} ${cut ? `<s>${fm(raw)}</s>→` : ""}${efx > 0 ? "+" : ""}${fm(efx)}${loan ? (ja() ? "＋これから返済" : " + repayment from now on") : ""}</div>` : "";
      /* 何が足りないのかを取りちがえないように、理由ごとに書きわける */
      const short = (o.req.univ && !p.univ)
        ? (ja() ? "大学に行っていないので、この道はつづいていない" : "No degree — this road doesn't continue")
        : (o.req.maxMoney != null && p.money >= o.req.maxMoney
          ? (ja() ? "いまのあなたは対象外だった" : "You're not eligible") : (ja() ? "カギが足りない" : "Not enough keys"));
      return `<div class="m-body">
        <div class="c-card ${ok ? "ok" : "ng"}">
          ${isDoor ? `<span class="d-badge ${ok ? "open" : "lock"}">${ic(ok ? "door" : "lock", "s")}${ok
            ? (ja() ? "開けられるトビラ" : "A door you can open")
            : (ja() ? "カギが足りないトビラ" : "A door you can't open")}</span>` : ""}
          <div class="c-title">${L(o.t)}</div>
          <div class="d-desc">${L(o.d)}</div>
          ${o.cons ? `<div class="d-cons">${L(o.cons)}</div>` : ""}
          ${key2 ? `<div class="c-key">${ja() ? "カギ：" : "Key: "}${key2}
            <span class="c-now">${ja() ? "いまのあなた：" : "You have: "}${money(p.money)}${ja() ? "／" : " / "}${learn(p.learn)}</span></div>` : ""}
          ${cost}
        </div>
        ${ok
          ? `<p class="c-ask">${W.ask}</p>
             <button class="m-btn" id="mYes" data-se="${isDoor ? "open" : "tap"}">${W.yes}</button>
             <button class="m-btn ghost" id="mBack">${W.backAgain}</button>`
          : `<p class="c-ask ng">${ic("lock", "s")} ${short}${W.ng}</p>
             <button class="m-btn" id="mBack">${W.back}</button>
             ${stuck ? `<button class="m-btn ghost" id="mPass">${W.pass}</button>` : ""}`}
      </div>`;
    };

    const bind = () => {
      document.querySelectorAll("#modalBox .door.pick:not(:disabled)").forEach(b => {
        b.onclick = () => {
          se(pd.states[+b.dataset.i] === "open" ? "unlock" : "locked");
          paint(confirmHtml(+b.dataset.i), +b.dataset.i);
        };
      });
      if ($("mBack")) $("mBack").onclick = () => paint(listHtml());
      if ($("mPass")) $("mPass").onclick = () => applyChoice(-1);
    };
    const paint = (body, pickI) => {
      $("modalBox").innerHTML = head + body;
      $("modalBox").scrollTop = 0;
      bind();
      if (pickI != null && $("mYes")) $("mYes").onclick = () => applyChoice(pickI);
    };
    openModal(head + listHtml());
    bind();
  }
  else if (pd.kind === "goal") {
    const loanNote = pd.loan > 0
      ? `<div class="m-note">${M.settleLoan
          ? (ja() ? `のこっていた奨学金 <b>${fm(pd.loan)}</b> を、ここで清算。<br>${lastAge()}歳——ようやく、返しおえた。`
                  : `The remaining scholarship (<b>${fm(pd.loan)}</b>) is settled here.<br>Age ${lastAge()} — finally paid off.`)
          : (ja() ? `奨学金が、まだ <b>${fm(pd.loan)}</b> のこっている。<br>${lastAge()}歳——返済は、これからも続く。`
                  : `<b>${fm(pd.loan)}</b> of your scholarship is still unpaid.<br>Age ${lastAge()} — the repayments go on.`)}</div>` : "";
    openModal(`<div class="m-head">
        ${tagChip("goal")}
        <h2>${ja() ? `${p.name} さん、${lastAge()}歳でゴール！` : `${p.name} reached the goal at ${lastAge()}!`}</h2></div>
      <div class="m-body">
        <p class="m-lead">${ja() ? `${firstAge()}歳からの${years()}年間、おつかれさま！ ${pd.rankAt}番目のゴールです。<br>全員がゴールしたら、けっか発表へ。`
          : `${years()} years from age ${firstAge()} — well done! Finished #${pd.rankAt}.<br>When everyone finishes, on to the results.`}</p>
        ${loanNote}${chgPanel(p, pd.fx || {})}
        <button class="m-btn" id="mOk">OK</button>
      </div>`);
    $("mOk").onclick = confirmPending;
  }
}

/* ---------- ネタバラシ ---------- */
function rawReqLabel(o) {
  const parts = [];
  if (o.req.univ) parts.push(ja() ? "大学を出ていること" : "university degree");
  if (o.req.money) parts.push(`${ja() ? "おかね" : "Money "}${fm(o.req.money)}`);
  if (o.req.learn) parts.push(`★${o.req.learn}`);
  if (o.req.maxMoney != null) parts.push(ja() ? `所得制限おかね${fm(o.req.maxMoney)}未満` : `income limit: under ${fm(o.req.maxMoney)}`);
  return parts.join("＋");
}
function fxInline(fx) {
  const parts = [];
  if (fx.money) parts.push(`${fx.money > 0 ? "+" : ""}${fm(fx.money)}`);
  if (fx.learn) parts.push(`★+${fx.learn}`);
  if (fx.happy) parts.push(`♥+${fx.happy}`);
  return parts.join(" ");
}
const RV_META = {
  chosen: ["check", { ja: "えらんだ", en: "Chosen" }, "#4CA872"],
  open: ["door", { ja: "開けられた", en: "Could open" }, "#4CA872"],
  locked: ["lock", { ja: "カギ不足", en: "Short of keys" }, "#C98A3C"],
  unseen: ["eye", { ja: "見えてなかった！", en: "Never saw it!" }, "#7E6BC4"],
};
function showRevealModal(i) {
  const p = players[i];
  const secs = p.doorLog.map(e => {
    const rows = e.opts.map((o, k) => {
      const st = e.chosen === k ? "chosen" : e.states[k];
      const [icon, label, col] = RV_META[st];
      const key = rawReqLabel(o), fx = fxInline(o.fx);
      return `<div class="rv-opt ${st}"><span class="rv-ic" style="color:${col}">${ic(icon)}</span>
        <span class="rv-main"><span class="rv-t">${L(o.t)}</span><span class="rv-d">${L(o.d)}</span>
        <span class="rv-meta">${key || (ja() ? "カギなし" : "No key")}${fx ? `　→ ${fx}` : ""}</span></span>
        <span class="rv-st">${L(label)}</span></div>`;
    }).join("");
    return `<div class="rv-door"><div class="rv-title">${e.age != null ? fage(e.age) + " ── " : ""}${L(e.title)}${e.variant ? `（${L(e.variant)}）` : ""}</div>${rows}</div>`;
  }).join("");
  openModal(`<div class="rule-page">
      ${tagChip("choice", ja() ? "ネタバラシ" : "The Reveal")}
      <h2>${ja() ? `${p.name} さんが出会ったトビラ、ぜんぶ` : `Every door ${p.name} met`}</h2>
      <p class="m-lead" style="text-align:left">${ja() ? "紫は、ゲーム中「？？？」で中身が見えなかったトビラ。<br>ほんとうは、こんな選択肢だった——" : "Purple marks options hidden as ？？？ during the game.<br>Here's what they really were —"}</p>
      <div class="rv-list">${secs || `<p class='m-lead'>${ja() ? "トビラには出会わなかったみたい。" : "No doors were met."}</p>`}</div>
      <button class="m-btn" id="rvOk">${ja() ? "とじる" : "Close"}</button></div>`, closeModal);
  $("rvOk").onclick = closeModal;
}
const whoChips = list => list.map(p => `<span class="who"><span class="p-dot" style="background:${p.color}"></span>${p.name}</span>`).join("");
/* 全員分・年齢順のトビラ一覧。だれも通らなかったトビラマスも載せる */
function showAllDoorsModal() {
  /* グループ分けキーは言語に依存しない日本語の原文で作る */
  const kt = v => v == null ? "" : (v.ja !== undefined ? v.ja : v);
  const map = new Map();
  players.forEach(p => p.doorLog.forEach(e => {
    const key = `${e.age}|${kt(e.title)}|${kt(e.variant)}`;
    if (!map.has(key)) map.set(key, { age: e.age, title: e.title, variant: e.variant, opts: e.opts, perOpt: e.opts.map(() => ({ chosen: [], locked: [], unseen: [] })) });
    const g = map.get(key);
    e.opts.forEach((o, i) => {
      if (!g.perOpt[i]) g.perOpt[i] = { chosen: [], locked: [], unseen: [] };
      if (e.chosen === i) g.perOpt[i].chosen.push(p);
      else if (e.states[i] === "unseen") g.perOpt[i].unseen.push(p);
      else if (e.states[i] === "locked") g.perOpt[i].locked.push(p);
    });
  }));
  M.SQUARES.forEach((sq, i) => {
    if (sq.t !== "choice") return;
    ((sq.key === "machi" || sq.key === "kurashi") ? [true, false] : [true]).forEach(rural => {
      const dummy = { fam: { rural }, perk: null, money: 0, learn: 0, shienDiscount: false, name: "", hidden: [] };
      const def = R.choiceDef(sq.key, dummy, M);
      const key = `${M.AGES[i]}|${kt(def.title)}|${kt(def.variant)}`;
      if (!map.has(key)) map.set(key, { age: M.AGES[i], title: def.title, variant: def.variant, opts: def.opts, perOpt: def.opts.map(() => ({ chosen: [], locked: [], unseen: [] })), untrodden: true });
    });
  });
  const secs = [...map.values()].sort((a, b) => a.age - b.age).map(g => {
    const rows = g.opts.map((o, i) => {
      const st = g.perOpt[i], key = rawReqLabel(o), fx = fxInline(o.fx), lines = [];
      if (st.chosen.length) lines.push(`<div class="rv-who" style="color:#4CA872">${ic("check", "s")} ${ja() ? "えらんだ" : "Chose"}：${whoChips(st.chosen)}</div>`);
      if (st.locked.length) lines.push(`<div class="rv-who" style="color:#C98A3C">${ic("lock", "s")} ${ja() ? "カギ不足" : "Short of keys"}：${whoChips(st.locked)}</div>`);
      if (st.unseen.length) lines.push(`<div class="rv-who" style="color:#7E6BC4">${ic("eye", "s")} ${ja() ? "見えなかった" : "Couldn't see"}：${whoChips(st.unseen)}</div>`);
      return `<div class="rv-opt ${st.unseen.length ? "unseen" : ""}"><span class="rv-main">
        <span class="rv-t">${L(o.t)}</span><span class="rv-d">${L(o.d)}</span>
        <span class="rv-meta">${key || (ja() ? "カギなし" : "No key")}${fx ? `　→ ${fx}` : ""}</span>${lines.join("")}</span></div>`;
    }).join("");
    return `<div class="rv-door"${g.untrodden ? ' style="opacity:.75"' : ""}>
      <div class="rv-title">${fage(g.age)} ── ${L(g.title)}${g.variant ? `（${L(g.variant)}）` : ""}${g.untrodden ? `<span class="rv-untrod">${ic("walk", "s")} ${ja() ? "だれも通らなかった" : "no one passed here"}</span>` : ""}</div>${rows}</div>`;
  }).join("");
  openModal(`<div class="rule-page">
      ${tagChip("choice", ja() ? "トビラ一覧" : "All Doors")}
      <h2>${ja() ? `${years()}年間に、こんなトビラがあった` : `The doors of these ${years()} years`}</h2>
      <p class="m-lead" style="text-align:left">${ja() ? "年齢の順に、この人生にあったトビラをぜんぶ並べた。<br>出会えたトビラも、通らなかったトビラも——見えていた景色は人それぞれ。"
        : "Every door in this life, in age order.<br>Doors you met and doors no one passed — what each player could see was different."}</p>
      <div class="rv-list">${secs}</div>
      <button class="m-btn" id="adOk">${ja() ? "とじる" : "Close"}</button></div>`, closeModal);
  $("adOk").onclick = closeModal;
}

function rulePageHtml(page) {
  const PAGES = rulePages();
  const pg = PAGES[page];
  const items = pg.items.map(([icon, tx]) => `<div class="rule-item"><span class="r-ic">${ic(icon)}</span><span>${L(tx)}</span></div>`).join("");
  const dots = PAGES.map((_, i) => `<span class="${i === page ? "on" : ""}"></span>`).join("");
  const last = page === PAGES.length - 1;
  return `<div class="rule-page">
      ${tagChip(pg.type, L(pg.tag))}
      <h2>${L(pg.title)}</h2>
      <div class="rule-list">${items}</div>
      <div class="rule-dots">${dots}</div>
      <div class="rule-nav">
        ${page > 0 ? `<button class="m-btn ghost" id="rulePrev">${ja() ? "← まえ" : "← Back"}</button>` : ""}
        ${last ? "" : `<button class="m-btn ghost" id="ruleClose">${ja() ? "とじる" : "Close"}</button>`}
        ${last ? `<button class="m-btn" id="ruleDone">${ja() ? "OK！" : "OK!"}</button>` : `<button class="m-btn" id="ruleNext">${ja() ? "つぎへ →" : "Next →"}</button>`}
      </div></div>`;
}
/* ページをめくるたびに「つぎへ」が上下に動くと、押しまちがえる。
   ぜんぶのページを画面の外で一度だけ測って、いちばん高いページに高さをそろえる */
let ruleH = { key: "", h: 0 };
function rulesMinHeight(width) {
  const key = `${lang}|${Math.round(width)}`;
  if (ruleH.key === key) return ruleH.h;
  const probe = document.createElement("div");
  probe.className = "modal";
  probe.style.cssText = `position:absolute; left:-9999px; top:0; visibility:hidden;`
    + `width:${width}px; max-height:none; height:auto; overflow:visible; animation:none;`;
  document.body.appendChild(probe);
  let h = 0;
  try {
    rulePages().forEach((_, i) => {
      probe.innerHTML = rulePageHtml(i);
      h = Math.max(h, probe.firstElementChild.offsetHeight);
    });
  } catch (e) { h = 0; }
  probe.remove();
  const fontsReady = !document.fonts || document.fonts.status === "loaded";
  ruleH = { key: fontsReady ? key : "", h };
  return h;
}
function renderRules(page) {
  const last = page === rulePages().length - 1;
  openModal(rulePageHtml(page), restore);
  const box = $("modalBox"), body = box.firstElementChild;
  const h = rulesMinHeight(box.getBoundingClientRect().width);
  if (h) body.style.minHeight = h + "px";
  if ($("ruleClose")) $("ruleClose").onclick = restore;
  if ($("rulePrev")) $("rulePrev").onclick = () => renderRules(page - 1);
  if (last) $("ruleDone").onclick = restore;
  else $("ruleNext").onclick = () => renderRules(page + 1);
}
$("helpBtnSetup").onclick = () => renderRules(0);
$("helpBtnGame").onclick = () => { if (!busy) renderRules(0); };

/* ---------- タイトルにもどる ---------- */
function showHomeConfirm() {
  openModal(`<div class="m-head">${tagChip("fam", ja() ? "タイトルにもどる" : "Back to title")}
      <h2>${ja() ? "ゲームをやめて、タイトルにもどる？" : "Quit this game and return to the title?"}</h2></div>
    <div class="m-body">
      <p class="m-lead">${ja() ? "いまのゲームの記録は消えます。<br>人数やメンバーを変えるときも、ここからやりなおせます。" : "The current game will be lost.<br>Return here to change players or group size."}</p>
      <button class="m-btn" id="mQuit">${ja() ? "タイトルにもどる" : "Back to title"}</button>
      <button class="m-btn ghost" id="mStay">${ja() ? "つづける" : "Keep playing"}</button>
    </div>`, restore);
  $("mQuit").onclick = () => {
    famIdx = null; pending = null; players = [];
    closeModal(); showScreen("setup"); window.scrollTo(0, 0);
  };
  $("mStay").onclick = restore;
}
$("homeBtn").onclick = () => { if (!busy) showHomeConfirm(); };

/* 開発用: ブラウザから内部状態をのぞくためのフック（自動プレイの確認に使う） */
window.__tobira = {
  get players() { return players; }, get turn() { return turn; }, get pending() { return pending; },
  get busy() { return busy; }, get famIdx() { return famIdx; },
};

/* ---------- 起動 ---------- */
diceFace(3);
initSetup();
applyLang();
